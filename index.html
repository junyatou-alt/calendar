<!DOCTYPE html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>公主的皇家时间魔法盒 👸</title>
    <!-- Stylesheets & Fonts -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Quicksand:wght@500;600;700&display=swap" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['Cinzel', 'Georgia', 'serif'],
                        sans: ['Quicksand', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes royalpulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px rgba(236,72,153,0.4)); }
            50% { transform: scale(1.02); filter: drop-shadow(0 0 12px rgba(251,191,36,0.7)); }
        }
        .animate-royal-sparkle {
            animation: royalpulse 4s infinite ease-in-out;
        }
        .scrollbar-thin::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .scrollbar-thin::-webkit-scrollbar-track {
            background: rgba(253, 224, 71, 0.1);
            border-radius: 10px;
        }
        .scrollbar-thin::-webkit-scrollbar-thumb {
            background: rgba(236, 72, 153, 0.3);
            border-radius: 10px;
        }
        .scrollbar-thin::-webkit-scrollbar-thumb:hover {
            background: rgba(236, 72, 153, 0.6);
        }
    </style>
</head>
<body class="bg-gradient-to-b from-pink-100 via-purple-100 to-pink-50 min-h-screen selection:bg-pink-300">
    <div id="root"></div>

    <!-- CDN Libraries -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- App Execution Block -->
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Custom Inline SVGs to bypass heavy lucide icons UMD bundles dependency
        function Icon({ name, className = "w-4 h-4" }) {
            const symbols = {
                ChevronLeft: <path d="m15 18-6-6 6-6"/>,
                ChevronRight: <path d="m9 18 6-6-6-6"/>,
                Plus: <path d="M5 12h14M12 5v14"/>,
                HelpCircle: (
                    <>

                ),

                Sparkles: <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>,
                BookOpen: <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zm20 0h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>,
                Heart: <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>,
                Trophy: (

                CalendarDays: (

                Percent: (
                    <>
                        <line x1="19" y1="5" x2="5" y2="19"/>

                    </>
                ),
                Clock: (
                    <>
                        <circle cx="12" cy="12" r="10"/>
                        <polyline points="12 6 12 12 16 14"/>
                    </>
                ),
                AlertCircle: (
                    <>
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="12" y1="8" x2="12" y2="12"/>
                        <line x1="12" y1="16" x2="12.01" y2="16"/>
                    </>
                ),
                Trash2: (
                    <>
                        <path d="M3 6h18"/>
                        <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
                        <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
                        <line x1="10" y1="11" x2="10" y2="17"/>
                        <line x1="14" y1="11" x2="14" y2="17"/>
                    </>
                ),
                X: <line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" strokeWidth="2" />,
                Circle: <circle cx="12" cy="12" r="10"/>,
                CheckSquare: (
                    <>
                        <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/>
                        <path d="m9 12 2 2 4-4"/>
                    </>
                ),
                MapPin: (
                    <>
                        <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/>
                        <circle cx="12" cy="10" r="3"/>
                    </>
                ),
                User: (
                    <>
                        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </>
                )
            };
            return (
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="2"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                    className={className}
                >
                    {symbols[name] || null}
                </svg>
            );
        }

        // CONSTANTS & HELPERS
        const EVENT_COLORS = {
            curriculum: { label: '课程表', bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-700', fillColor: '#059669', emoji: '📚', hoverBg: 'hover:bg-emerald-100' },
            daka: { label: '习惯打卡', bg: 'bg-purple-50', border: 'border-purple-300', text: 'text-purple-700', fillColor: '#7c3aed', emoji: '⭐', hoverBg: 'hover:bg-purple-100' },
            reminder: { label: '每日提醒', bg: 'bg-amber-50', border: 'border-amber-300', text: 'text-amber-700', fillColor: '#d97706', emoji: '⏰', hoverBg: 'hover:bg-amber-100' },
            regular: { label: '常规事项', bg: 'bg-blue-50', border: 'border-blue-300', text: 'text-blue-700', fillColor: '#2563eb', emoji: '🎈', hoverBg: 'hover:bg-blue-100' }
        };

        const USER_GUIDE = [
            { emoji: '🎒', text: '加个课程：填写开始时间跟课程名字，课程字样就会变成翠绿色的噢！' },
            { emoji: '⭐', text: '习惯打卡：写出你的好习惯，还可以在里面添加各个有趣的子任务噢！' },
            { emoji: '⏰', text: '时间冲突高亮：如果同一时间段内写了两个计划，格子就会自动显示粉色占用状态！' },
            { emoji: '🎯', text: '预计时间：可以给每个小梦想设定预计时间，每天收集统计星星进度！' },
            { emoji: '🖐️', text: '鼠标拖放：在月视图、周视图、单日视图里，可以用鼠标拖动卡片到任意日期或小时哦！' }
        ];

        const PRINCESS_COURSES = ['皇家文学 📖', '优雅礼仪 👑', '魔法数学 📐', '星空探索 🔭', '皇家音律 🎵', '森林马术 🐎', '神奇绘画 🎨', '精灵英语 🔠', '人鱼游泳 🧜‍♀️', '古堡历史 🏰'];

        function timeToMinutes(timeStr) {
            const [hours, minutes] = timeStr.split(':').map(Number);
            return hours * 60 + minutes;
        }

        function minutesToTime(minutes) {
            const hours = Math.floor(minutes / 60);
            const mins = minutes % 60;
            return `${hours.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}`;
        }

        function formatDate(date) {
            const y = date.getFullYear();
            const m = (date.getMonth() + 1).toString().padStart(2, '0');
            const d = date.getDate().toString().padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function getMonthDays(year, month) {
            const firstDayOfMonth = new Date(year, month, 1);
            const firstDayWeekday = firstDayOfMonth.getDay();
            const startOffset = firstDayWeekday === 0 ? 6 : firstDayWeekday - 1;
            const startDate = new Date(year, month, 1 - startOffset);
            const days = [];
            for (let i = 0; i < 42; i++) {
                const day = new Date(startDate);
                day.setDate(startDate.getDate() + i);
                days.push(day);
            }
            return days;
        }

        function getWeekDays(date) {
            const weekday = date.getDay();
            const offset = weekday === 0 ? 6 : weekday - 1;
            const monday = new Date(date);
            monday.setDate(date.getDate() - offset);
            const days = [];
            for (let i = 0; i < 7; i++) {
                const day = new Date(monday);
                day.setDate(monday.getDate() + i);
                days.push(day);
            }
            return days;
        }

        const TIME_SLOTS = [];
        for (let h = 6; h <= 21; h++) {
            TIME_SLOTS.push(`${h.toString().padStart(2, '0')}:00`);
            TIME_SLOTS.push(`${h.toString().padStart(2, '0')}:30`);
        }
        TIME_SLOTS.push('22:00');

        function isSlotOccupied(dateStr, timeStr, events) {
            const slotStartMin = timeToMinutes(timeStr);
            const slotEndMin = slotStartMin + 30;
            const dayEvents = events.filter(e => e.date === dateStr);
            for (const event of dayEvents) {
                const eventStartMin = timeToMinutes(event.startTime);
                const eventEndMin = eventStartMin + (event.estimatedDuration || 30);
                if (Math.max(slotStartMin, eventStartMin) < Math.min(slotEndMin, eventEndMin)) {
                    return true;
                }
            }
            return false;
        }

        function hasDayConflicts(events, dateStr) {
            const dayEvents = events.filter(e => e.date === dateStr);
            const sortedEvents = dayEvents.sort((a, b) => a.startTime.localeCompare(b.startTime));
            for (let i = 0; i < sortedEvents.length - 1; i++) {
                const current = sortedEvents[i];
                const next = sortedEvents[i + 1];
                const aStartMin = timeToMinutes(current.startTime);
                const aEndMin = aStartMin + (current.estimatedDuration || 30);
                const bStartMin = timeToMinutes(next.startTime);
                if (aEndMin > bStartMin) {
                    return true;
                }
            }
            return false;
        }

        // COMPONENT: CalendarHeader
        function CalendarHeader({ viewMode, setViewMode, currentDate, setCurrentDate, onAddEventClick, events }) {
            const handlePrevious = () => {
                const nextDate = new Date(currentDate);
                if (viewMode === 'month') nextDate.setMonth(currentDate.getMonth() - 1);
                else if (viewMode === 'week') nextDate.setDate(currentDate.getDate() - 7);
                else if (viewMode === 'day') nextDate.setDate(currentDate.getDate() - 1);
                setCurrentDate(nextDate);
            };

            const handleNext = () => {
                const nextDate = new Date(currentDate);
                if (viewMode === 'month') nextDate.setMonth(currentDate.getMonth() + 1);
                else if (viewMode === 'week') nextDate.setDate(currentDate.getDate() + 7);
                else if (viewMode === 'day') nextDate.setDate(currentDate.getDate() + 1);
                setCurrentDate(nextDate);
            };

            const todayStr = formatDate(new Date());
            const todayEvents = events.filter(e => e.date === todayStr);
            const doneToday = todayEvents.filter(e => e.completed).length;
            const totalToday = todayEvents.length;

            const getSmartQuote = () => {
                if (totalToday === 0) return "✨ 皇家仙女~ 🪄 今天我的本子上干干净净的呢，今天你最想完成什么事？点击右侧记一笔魔法吧！";
                if (doneToday === totalToday) return "✨ 仙女呼唤！🦭 你把今天的计划全部通关啦！太优秀了，今天可以尽情在城堡里看有趣的画本并玩耍啦！";
                if (doneToday > 0) return `✨ 仙女~ 🪄 已完成 ${doneToday}/${totalToday} 个小任务！你现在状态绝佳，我们一起继续，击败剩下的计划吧！✊🧚‍♀️`;
                return "✨ 城堡提示~ 😉 今天的魔法计划已列好！小主人，伸个懒腰，开始完成第一项小任务吧！";
            };

            const getHeaderTitleText = () => {
                const y = currentDate.getFullYear();
                const m = currentDate.getMonth() + 1;
                if (viewMode === 'month') return `${y}年 ${m}月`;
                if (viewMode === 'week') {
                    const weekdays = getWeekDays(currentDate);
                    return `${weekdays[0].getMonth() + 1}月${weekdays[0].getDate()}日 ~ ${weekdays[6].getMonth() + 1}月${weekdays[6].getDate()}日 (本周)`;
                }
                if (viewMode === 'day') return `${y}年${m}月${currentDate.getDate()}日 $剪['周日', '周一', '周二', '周三', '周四', '周五', '周六'][currentDate.getDay()]}`;
                return "好习惯打卡成就记录";
            };

            return (
                <div className="space-y-4">
                    {/* Fairy banner */}
                    <div className="bg-gradient-to-r from-pink-100 via-rose-100 to-purple-100 border-4 border-pink-350 rounded-3xl p-4 shadow-[4px_4px_0px_0px_#ec4899] flex items-center gap-4 text-left relative overflow-hidden animate-royal-sparkle">
                        <div className="absolute right-2 -bottom-2 text-6xl opacity-20 select-none pointer-events-none">🏰</div>
                        <div className="text-4xl shrink-0 select-none filter drop-shadow-[0_0_8px_rgba(251,191,36,0.8)]">🧚‍♀️</div>
                        <div>
                            <h4 className="text-xs font-bold font-serif text-pink-700 tracking-wider flex items-center gap-1.5">
                                <span>✨ 智慧皇家仙女 · 聪聪 (Smart Royal Fairy)</span>
                                <span className="text-amber-500 font-sans">👑</span>
                            </h4>
                            <p className="text-xs sm:text-sm font-bold text-rose-950 mt-1 leading-relaxed">
                                {getSmartQuote()}
                            </p>
                        </div>
                    </div>

                    {/* Main Bar */}
                    <div className="flex flex-col xl:flex-row items-center justify-between gap-4">
                        <div className="flex flex-wrap items-center gap-3 w-full xl:w-auto">
                            <div className="flex items-center gap-2 shrink-0 mr-4">
                                <span className="text-4xl animate-bounce">👑</span>
                                <div>
                                    <p className="text-2xl font-black font-serif text-pink-600 tracking-wide filter drop-shadow-[1px_1px_1px_rgba(253,244,180,0.8)]">👸 皇家时间魔法盒</p>
                                    <p className="text-[10px] font-black tracking-widest text-amber-600 font-serif">✨ ROYAL PRINCESS CALENDAR ✨</p>
                                </div>
                            </div>

                            <div className="flex flex-wrap items-center gap-1.5 p-1 bg-gradient-to-r from-pink-50 to-purple-50 rounded-2xl border-2 border-pink-300 shadow-[2px_2px_0px_0px_#db2777]">
                                {[
                                    { id: 'month', label: '月度魔法 📅' },
                                    { id: 'week', label: '周计划 🗓️' },
                                    { id: 'day', label: '公主一日 🕒' },
                                    { id: 'dakaPanel', label: '习惯水晶球 ⭐' },
                                    { id: 'curriculumView', label: '🏰 皇家课程表 📚' },
                                ].map((v) => (
                                    <button
                                        key={v.id}
                                        onClick={() => setViewMode(v.id)}
                                        className={`px-3 py-1.5 rounded-xl font-bold text-xs transition cursor-pointer ${
                                            viewMode === v.id
                                                ? 'bg-gradient-to-r from-amber-300 to-yellow-300 text-pink-800 shadow-[2px_2px_0px_0px_#db2777] border border-pink-400'
                                                : 'text-pink-700 hover:bg-pink-100/60'
                                        }`}
                                    >
                                        {v.label}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* Navigation controllers */}
                        <div className="flex items-center justify-between xl:justify-end gap-3 w-full xl:w-auto">
                            {viewMode !== 'dakaPanel' && (
                                <div className="flex items-center gap-2">
                                    <button onClick={handlePrevious} className="p-2 bg-pink-50 hover:bg-pink-100 border-2 border-pink-400 rounded-2xl cursor-pointer shadow-[2px_2px_0px_0px_#db2777]">
                                        <Icon name="ChevronLeft" className="w-5 h-5 text-pink-700" />
                                    </button>
                                    <div className="py-2 px-4 bg-gradient-to-r from-pink-50 to-amber-50 border-2 border-pink-400 rounded-2xl text-center min-w-[150px] shadow-[2px_2px_0px_0px_#db2777]">
                                        <span className="text-xs sm:text-sm font-bold font-serif text-pink-850">
                                            {getHeaderTitleText()}
                                        </span>
                                    </div>
                                    <button onClick={handleNext} className="p-2 bg-pink-50 hover:bg-pink-100 border-2 border-pink-400 rounded-2xl cursor-pointer shadow-[2px_2px_0px_0px_#db2777]">
                                        <Icon name="ChevronRight" className="w-5 h-5 text-pink-700" />
                                    </button>
                                </div>
                            )}

                            <div className="flex items-center gap-2">
                                {viewMode !== 'dakaPanel' && (
                                    <button onClick={() => setCurrentDate(new Date())} className="px-3.5 py-2 bg-pink-100 hover:bg-pink-200 border-2 border-pink-300 rounded-2xl font-bold text-xs text-pink-800 shadow-[2px_2px_0px_0px_#db2777]">
                                        ✨ 今天
                                    </button>
                                )}
                                <button onClick={() => onAddEventClick()} className="px-4 py-2 bg-gradient-to-r from-amber-300 to-yellow-300 text-pink-900 border-2 border-pink-400 rounded-2xl font-bold text-xs cursor-pointer flex items-center gap-1.5 shadow-[2px_2px_0px_0px_#db2777]">
                                    <Icon name="Plus" className="w-4 h-4 text-pink-900" />
                                    <span>记一笔魔法 🪄</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // COMPONENT: MonthView
        function MonthView({ currentDate, events, onEventClick, onAddEventClick, onEventMove, setDraggedItem, draggedItem, onDayClick }) {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const days = getMonthDays(year, month);
            const weekDaysShort = ['周一 🦄', '周二 🐼', '周三 🐨', '周四 🦊', '周五 🦁', '周六 🐯', '周日 🐰'];

            const handleDragStart = (e, event) => {
                e.dataTransfer.setData('text/plain', event.id);
                setDraggedItem({ id: event.id, originDate: event.date });
            };

            const handleDrop = (e, targetDateStr) => {
                e.preventDefault();
                const eventId = e.dataTransfer.getData('text/plain') || (draggedItem && draggedItem.id);
                if (eventId) {
                    onEventMove(eventId, targetDateStr);
                }
                setDraggedItem(null);
            };

            return (
                <div className="w-full bg-[#fffcfb]/90 rounded-3xl border-4 border-pink-300 p-4 shadow-[6px_6px_0px_0px_#db2777]">
                    <div className="grid grid-cols-7 gap-2 mb-2 text-center">
                        {weekDaysShort.map((name, idx) => (
                            <div key={idx} className={`py-2 rounded-2xl border-2 border-pink-250 font-bold text-xs ${idx >= 5 ? 'bg-amber-100 hover:bg-amber-200 text-amber-800' : 'bg-pink-50 hover:bg-pink-100 text-pink-800'}`}>
                                {name}
                            </div>
                        ))}
                    </div>

                    <div className="grid grid-cols-7 gap-2">
                        {days.map((day, idx) => {
                            const dateStr = formatDate(day);
                            const isCurrentMonth = day.getMonth() === month;
                            const isToday = formatDate(new Date()) === dateStr;
                            const dayEvents = events.filter(e => e.date === dateStr);
                            const hasOverlap = hasDayConflicts(events, dateStr);

                            return (
                                <div
                                    key={idx}
                                    onDragOver={e => e.preventDefault()}
                                    onDrop={e => handleDrop(e, dateStr)}
                                    onClick={() => onDayClick(day)}
                                    className={`min-h-[110px] p-1.5 rounded-2xl border-2 flex flex-col justify-between transition-all duration-200 cursor-pointer relative ${
                                        isToday 
                                            ? 'bg-yellow-100/95 border-pink-400 shadow-[inset_0_0_0_2px_#db2777]' 
                                            : isCurrentMonth 
                                            ? 'bg-white border-pink-100 hover:border-pink-300' 
                                            : 'bg-stone-50 text-stone-400 border-pink-50 opacity-50'
                                    } ${hasOverlap ? 'border-dashed border-rose-500 bg-rose-50/50' : ''}`}
                                >
                                    <div className="flex items-center justify-between mb-1">
                                        <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${isToday ? 'bg-pink-500 text-white' : 'text-pink-905'}`}>
                                            {day.getDate()}{isToday && ' ☀️'}
                                        </span>
                                        {hasOverlap && (
                                            <span className="text-[8px] bg-rose-100 border border-rose-300 text-rose-650 px-1 py-0.2 rounded-full font-bold animate-pulse" title="时间有重叠占用">
                                                🚨 Conflict
                                            </span>
                                        )}
                                    </div>

        // COMPONENT: WeekView
        function WeekView({ currentDate, events, onEventClick, onAddEventClick, onEventMove, setDraggedItem, draggedItem, onDayClick }) {

                                </div>

                    </div>

                            {TIME_SLOTS.map(time => {

                                    const startIndex = TIME_SLOTS.indexOf(time);

        // COMPONENT: DayView
        function DayView({ currentDate, events, onEventClick, onAddEventClick, onEventMove, onUpdateEvent, setDraggedItem, draggedItem }) {
            const dateStr = formatDate(currentDate);
            const dayEvents = events.filter(e => e.date === dateStr);
            const sortedEvents = dayEvents.sort((a, b) => a.startTime.localeCompare(b.startTime));

            const totalEstimatedMins = sortedEvents.reduce((acc, curr) => acc + curr.estimatedDuration, 0);

                if (!event.dakaSubitems) return;
                const updatedSub = event.dakaSubitems.map(s => s.id === subitemId ? { ...s, completed: !s.completed } : s);
                const completes = event.dakaMode === 'any' ? updatedSub.some(s => s.completed) : updatedSub.every(s => s.completed);
                onUpdateEvent({ ...event, dakaSubitems: updatedSub, completed: completes });

                        <div className="flex items-center justify-between mb-4 border-b-2 border-pink-200 pb-2">
                            <h4 className="text-sm font-bold font-serif text-pink-700 flex items-center gap-1.5">
                                <Icon name="Clock" className="w-5 h-5 text-pink-500" />
                                ⏱️ 公主魔法时刻
                            </h4>
                            <span className="text-[10px] font-bold text-pink-400 font-mono">06:00 - 22:00</span>
                        </div>

                        <div className="space-y-1.5 max-h-[500px] overflow-y-auto pr-1 scrollbar-thin">
                            {(() => {
                                const renderedSlots = [];
                                const skippedTimes = new Set();
                                const SLOT_HEIGHT = 38;
                                const SLOT_GAP = 5;

                                TIME_SLOTS.forEach(time => {
                                    if (skippedTimes.has(time)) return;
                                    const startingEvents = sortedEvents.filter(e => e.startTime === time);

                                    if (startingEvents.length > 0) {
                                        const maxDuration = Math.max(...startingEvents.map(e => e.estimatedDuration || 30));
                                        const slotsCount = Math.max(1, Math.ceil(maxDuration / 30));
                                        const startIndex = TIME_SLOTS.indexOf(time);
                                        for (let i = 1; i < slotsCount; i++) {
                                            if (startIndex + i < TIME_SLOTS.length) {

                                            <div key={time} onDragOver={e => e.preventDefault()} onDrop={e => handleDrop(e, time)} className="flex gap-2.5 px-1.5 py-0.5 border-b border-dashed border-pink-100 items-start hover:bg-pink-50/30 relative select-none shrink-0" style={{ minHeight: `${calculatedHeight}px` }}>

                                                <div className="flex-grow flex flex-col gap-1 w-full justify-center">
                                                    {startingEvents.map(event => (
                                                        <div
                                                            key={event.id}
                                                            draggable
                                                            onDragStart={e => {
                                                                e.dataTransfer.setData('text/plain', event.id);
                                                                setDraggedItem({ id: event.id, originDate: dateStr, originTime: time });
                                                            }}
                                                            onClick={e => { e.stopPropagation(); onEventClick(event); }}
                                                            className={`w-full p-2 rounded-xl border-2 border-pink-300 flex items-center justify-between shadow-[2px_2px_0px_0px_#db2777] cursor-grab ${EVENT_COLORS[event.type].bg}`}
                                                            style={{ color: event.textColor || EVENT_COLORS[event.type].fillColor, minHeight: `${calculatedHeight - 6}px` }}
                                                        >
                                                            <div className="flex items-center gap-1 truncate text-left">
                                                                <span className="text-sm shrink-0">{EVENT_COLORS[event.type].emoji}</span>

                                                                    <p className="font-bold text-[10px] truncate leading-tight">{event.title}</p>
                                                                    <p className="text-[8px] opacity-80 leading-none mt-0.5">{event.startTime} ({event.estimatedDuration}分)</p>
                                                                </div>

                                                                {event.completed && <span className="text-[10px]">👑</span>}
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        );
                                    } else {
                                        const isOccupiedByAny = isSlotOccupied(dateStr, time, events);
                                        const isHour = time.endsWith(':00');
                                        renderedSlots.push(
                                            <div key={time} onDragOver={e => e.preventDefault()} onDrop={e => handleDrop(e, time)} onClick={() => onAddEventClick(dateStr, time)} className="flex gap-3 px-1.5 py-0.5 border-b border-dashed items-center transition-colors shrink-2 h-[38px] relative cursor-pointer hover:bg-pink-50/20 border-pink-55">
                                                <div className="w-10 text-center text-[10px] shrink-0 font-mono font-bold">
                                                    <span className={isHour ? 'text-pink-600 text-[11px] font-extrabold' : 'text-pink-400'}>{time}</span>
                                                </div>
                                                <div className="flex-grow pointer-events-none text-left">
                                                    {isOccupiedByAny ? (
                                                        <div className="bg-rose-100 text-rose-700 px-2 py-0.5 rounded border border-rose-300 text-[8px] font-bold flex items-center gap-0.5 animate-pulse">

                                return renderedSlots;
                            })()}
                        </div>
                    </div>

                    {/* RIGHT details */}
                    <div className="lg:col-span-7 space-y-4">

                            </div>
                            <div className="bg-white/95 border-2 border-pink-450 px-3 py-1 rounded-2xl text-center shadow-[2px_2px_0px_0px_#db2777]">

                                            {event.type !== 'daka' ? (
                                                <button onClick={() => toggleEventDirect(event)} className="p-1 rounded-full text-pink-700 cursor-pointer">

        // COMPONENT: CurriculumView
        function CurriculumView({ currentDate, events, onSaveEvent, onDeleteEvent, onUpdateEvent }) {
            const weekDays = getWeekDays(currentDate);
            const weekDaysStr = weekDays.map(d => formatDate(d));

            const [courseTitle, setCourseTitle] = useState('');
            const [selectedDayIdx, setSelectedDayIdx] = useState(0);
            const [startTime, setStartTime] = useState('08:30');
            const [duration, setDuration] = useState(45);
            const [teacher, setTeacher] = useState('');
            const [location, setLocation] = useState('');
            const [notes, setNotes] = useState('');

            const handleAddCourse = (e) => {
                e.preventDefault();
                if (!courseTitle.trim()) return;
                const targetDate = weekDaysStr[selectedDayIdx];
                onSaveEvent({
                    title: courseTitle.trim(),
                    type: 'curriculum',
                    date: targetDate,
                    startTime: startTime,
                    estimatedDuration: Number(duration),
                    color: 'bg-emerald-50',
                    textColor: '#059669',
                    teacher: teacher.trim() || undefined,
                    location: location.trim() || undefined,
                    notes: notes.trim() || undefined,
                    completed: false
                });

                setCourseTitle('');
                setTeacher('');
                setLocation('');
                setNotes('');
            };

            const currWeekEvents = events.filter(e => e.type === 'curriculum' && weekDaysStr.includes(e.date));

            return (
                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                    {/* LEFT creator */}
                    <div className="lg:col-span-4 bg-gradient-to-br from-pink-50 via-purple-50 to-pink-100 rounded-3xl border-4 border-pink-200 p-4 shadow-[5px_5px_0px_0px_#db2777]">
                        <h4 className="text-sm font-extrabold text-pink-700 tracking-wider flex items-center gap-1 mb-2 border-b-2 border-pink-150 pb-1.5">👸 课程魔法编辑器</h4>
                        <div className="mb-3.5">
                            <label className="text-[10px] font-bold text-pink-500 mb-1 block">✨ 精选皇家推荐课：</label>
                            <div className="flex flex-wrap gap-1.5">
                                {PRINCESS_COURSES.map(c => (
                                    <button key={c} type="button" onClick={() => setCourseTitle(c)} className="px-2.5 py-0.5 bg-white text-pink-800 rounded-full border border-pink-250 hover:bg-pink-100 text-[10px] font-bold">{c}</button>
                                ))}
                            </div>
                        </div>

                        <form onSubmit={handleAddCourse} className="space-y-3">
                            <div>
                                <label className="text-[10px] font-bold text-pink-700 block mb-0.5">🔍 课程/魔法名称</label>
                                <input type="text" value={courseTitle} onChange={e => setCourseTitle(e.target.value)} placeholder="如: 皇家文学 📖" className="w-full px-3 py-1.5 rounded-xl border border-pink-300 bg-white text-xs font-bold" required />
                            </div>
                            <div className="grid grid-cols-2 gap-2">
                                <div>
                                    <label className="text-[10px] font-bold text-pink-700 block mb-0.5">📅 魔法星期</label>
                                    <select value={selectedDayIdx} onChange={e => setSelectedDayIdx(Number(e.target.value))} className="w-full px-2 py-1.5 rounded-xl border border-pink-300 bg-white text-xs font-bold">
                                        {['周一 🦄', '周二 🐼', '周三 🐨', '周四 🦊', '周五 🦁', '周六 🐯', '周日 🐰'].map((d, i) => (
                                            <option key={i} value={i}>{d}</option>
                                        ))}
                                    </select>
                                </div>
                                <div>
                                    <label className="text-[10px] font-bold text-pink-700 block mb-0.5">🕒 上课时间</label>
                                    <input type="time" value={startTime} onChange={e => setStartTime(e.target.value)} className="w-full px-2 py-1.5 rounded-xl border border-pink-300 bg-white text-xs font-bold" required />
                                </div>
                            </div>
                            <div className="grid grid-cols-2 gap-2">
                                <div>
                                    <label className="text-[10px] font-bold text-pink-700 block mb-0.5">⏳ 课程时长 (分)</label>
                                    <input type="number" value={duration} onChange={e => setDuration(Number(e.target.value))} className="w-full px-3 py-1.5 rounded-xl border border-pink-300 bg-white text-xs font-bold" required />
                                </div>
                                <div>
                                    <label className="text-[10px] font-bold text-pink-700 block mb-0.5">🏰 上课地点</label>
                                    <input type="text" value={location} onChange={e => setLocation(e.target.value)} placeholder="如: 皇家图书馆" className="w-full px-3 py-1.5 rounded-xl border border-pink-300 bg-white text-xs" />
                                </div>
                            </div>
                            <div>
                                <label className="text-[10px] font-bold text-pink-700 block mb-0.5">👤 讲家/老师</label>

                            </div>
                            <div>
                                <label className="text-[10px] font-bold text-pink-700 block mb-0.5">📝 课堂备注</label>
                                <textarea value={notes} onChange={e => setNotes(e.target.value)} placeholder="记得带好皇家默写本哦！" className="w-full px-3 py-1.5 rounded-xl border border-pink-300 bg-white text-xs h-12 resize-none" />
                            </div>
                            <button type="submit" className="w-full py-2 bg-gradient-to-r from-pink-400 to-rose-450 hover:from-pink-500 hover:to-rose-500 text-white font-bold rounded-2xl border-2 border-pink-500 shadow-[2px_2px_0px_0px_#db2777]">
                                🦄 添加到魔法课程表
                            </button>
                        </form>
                    </div>

                    {/* RIGHT schedule timetable columns */}
                    <div className="lg:col-span-8 bg-[#fffcf5] border-4 border-yellow-350 rounded-3xl p-5 shadow-[5px_5px_0px_0px_#ca8a04]">
                        <div className="mb-4 flex flex-wrap items-center justify-between gap-2 border-b-2 border-yellow-100 pb-2">
                            <div>
                                <h3 className="text-md font-bold font-serif text-amber-700">🏰 皇家魔法大课程表 (Timetable)</h3>

                                return (
                                    <div key={dStr} className={`p-3 rounded-2xl border-2 transition ${isToday ? 'bg-gradient-to-r from-pink-50 to-amber-50 border-yellow-400 shadow-[2px_2px_0px_0px_#ca8a04]' : 'bg-white border-pink-50'}`}>

                                                <span className="text-[9px] font-bold text-pink-300 font-mono">({day.getMonth() + 1}月{day.getDate()}日)</span>

                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-2">

                                                        <div className="flex items-start justify-between">
                                                            <button onClick={() => onUpdateEvent({...lesson, completed: !lesson.completed})} className="text-xs font-bold text-pink-850 text-left">
                                                                {lesson.completed ? '💖' : '🤍'} {lesson.title}
                                                            </button>
                                                            <button onClick={() => onDeleteEvent(lesson.id)} className="p-1 text-pink-300 hover:text-red-500 font-bold text-xs opacity-0 group-hover:opacity-100 transition">

                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        }

        // COMPONENT: RewardSection
        function RewardSection({ events }) {
            const [activeTab, setActiveTab] = useState('badges');
            const completed = events.filter(e => e.completed);
            const totalDoneCount = completed.length;
            const dakaDone = events.filter(e => e.type === 'daka' && e.completed).length;
            const curriculumDone = events.filter(e => e.type === 'curriculum' && e.completed).length;

            const hasEarlyBirdBird = completed.some(e => {
                const [h, m] = e.startTime.split(':').map(Number);
                return h < 8 || (h === 8 && m <= 30);

            const busySubDoneTasks = events.filter(e => e.type === 'daka').reduce((acc, curr) => acc + (curr.dakaSubitems?.filter(s => s.completed).length || 0), 0);

            const badgesList = [
                { id: 'novice', name: '萌新魔法学徒 🎒', desc: '开始小公主的第一步！你解开了时间的初级密码！', unlocked: totalDoneCount >= 1, goal: '完成 1 项小计划', emoji: '🎒', color: 'bg-emerald-50 border-emerald-300 text-emerald-800' },
                { id: 'streaker', name: '自律城堡小之星 ⭐', desc: '坚持每日打卡习惯，你正在获取令人骄傲的小超能力！', unlocked: dakaDone >= 1, goal: '完成 1 项习惯打卡', emoji: '⭐', color: 'bg-purple-50 border-purple-300 text-purple-800' },

                { id: 'busy_bee', name: '劳动光荣小蜜蜂 🧹', desc: '不怕困难！连打卡底下的细小目标都被你通盘击破！', unlocked: busySubDoneTasks >= 2, goal: '搞定 2 个打卡子任务', emoji: '🧹', color: 'bg-pink-50 border-pink-300 text-pink-850' },
                { id: 'champion', name: '皇家自律领主 🏆', desc: '了不起！你累计达成了大量目标，全城堡都在为你鼓掌！', unlocked: totalDoneCount >= 4, goal: '累计完成 4 项计划', emoji: '🏆', color: 'bg-rose-50 border-rose-300 text-rose-800' }
            ];

            const unlockedCount = badgesList.filter(b => b.unlocked).length;

            const getEvaluationRating = () => {
                if (totalDoneCount === 0) return { title: "见习时光指挥官", desc: "还没建立打卡，点击记一笔魔法设定属于你自己的计划书吧！", tip: "💡 建议: 先从大声背唐诗和扫一扫书桌开始，迈向卓越！" };
                if (totalDoneCount >= 5) return { title: "🥇 闪亮皇家大魔法师", desc: "了不起！在时光中展现了极强的自律精神，你简直是效率的模范化身！", tip: "💡 提示: 完美极了，可以请爸爸妈妈额外给你一些草莓蛋糕奖励喔！" };
                return { title: "🥈 勤勤恳恳时见习生", desc: "已经在慢慢和时间做朋友了，完成率也在稳步提高！你做得很棒！", tip: "💡 建议: 把厚厚的书本内容拆成可口的草莓子项目，一个个咬碎！" };
            };

            const evalInfo = getEvaluationRating();

            // Compile past 7 days micro bar charts
            const getPastDays = () => {
                const list = [];
                for (let i = 6; i >= 0; i--) {
                    const d = new Date();

                const done = dayEvs.filter(e => e.completed).length;

                    </div>

                    {activeTab === 'badges' ? (

                        </div>
                    ) : (
                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-5">
                            <div className="lg:col-span-7 bg-white rounded-2xl border-2 border-pink-200 p-4 shadow-[2px_2px_0px_0px_#db2777]">
                                <h5 className="text-[11px] font-bold text-pink-700 block mb-1">📊 本周魔法进度积木 (7日打卡图表示意)：</h5>
                                <div className="flex items-end justify-between h-32 gap-1 px-1 pt-3 font-mono border-b border-pink-50">
                                    {dayStats.map((st, idx) => (
                                        <div key={idx} className="flex-grow flex flex-col items-center h-full justify-end relative group">
                                            <span className="hidden group-hover:block absolute bottom-full bg-slate-800 text-white text-[8.5px] p-1 rounded white-nowrap z-20">打卡 {st.done}/{st.total}</span>
                                            {st.total > 0 ? (
                                                <div className={`w-full rounded-t border-t-2 border-x-2 border-pink-350 shadow-sm ${st.percent === 100 ? 'bg-emerald-300' : st.percent >= 50 ? 'bg-purple-300' : 'bg-amber-300'}`} style={{ height: `${st.percent}%` }} />
                                            ) : (
                                                <div className="w-full h-[4px] bg-slate-100 rounded border border-stone-200" />
                                            )}
                                            <span className="text-[8.5px] font-bold text-pink-500 whitespace-nowrap mt-2">{st.label}</span>
                                        </div>
                                    ))}
                                </div>
                                <p className="text-[9.5px] font-bold text-pink-400 mt-2 block text-center">💡 城堡里的领航者：今日你正在一点点征服浩瀚的时间海洋！🚀</p>
                            </div>

                            <div className="lg:col-span-5 bg-[#fffdfa] border-2 border-pink-200 p-4 rounded-2xl shadow-[2px_2px_0px_0px_#db2777] flex flex-col justify-between">
                                <div>
                                    <h5 className="text-xs font-bold text-pink-850">🧙‍♂️ 时光精灵智慧物语评：</h5>
                                    <p className="text-xs font-bold text-purple-900 mt-1 leading-snug">『 {evalInfo.title} 』</p>
                                    <p className="text-[11px] text-slate-655 font-bold leading-normal mt-1 block">{evalInfo.desc}</p>
                                </div>
                                <p className="text-[10px] text-amber-700 font-bold border-t border-dashed border-pink-100 pt-2.5 mt-2">{evalInfo.tip}</p>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // COMPONENT: EventModal
        function EventModal({ isOpen, onClose, onSave, onDelete, eventToEdit, initialDate, initialTime }) {
            const [title, setTitle] = useState('');
            const [type, setType] = useState('regular');
            const [date, setDate] = useState('');
            const [startTime, setStartTime] = useState('08:00');
            const [duration, setDuration] = useState(30);
            const [customColor, setCustomColor] = useState('');
            const [notes, setNotes] = useState('');
            const [dakaMode, setDakaMode] = useState('all');
            const [dakaSubitems, setDakaSubitems] = useState([]);
            const [newSub, setNewSub] = useState('');
            const [teacher, setTeacher] = useState('');
            const [location, setLocation] = useState('');

            useEffect(() => {
                if (eventToEdit) {
                    setTitle(eventToEdit.title);
                    setType(eventToEdit.type);
                    setDate(eventToEdit.date);
                    setStartTime(eventToEdit.startTime);
                    setDuration(eventToEdit.estimatedDuration || 30);
                    setCustomColor(eventToEdit.textColor || '');
                    setNotes(eventToEdit.notes || '');
                    setDakaMode(eventToEdit.dakaMode || 'all');
                    setDakaSubitems(eventToEdit.dakaSubitems || []);
                    setTeacher(eventToEdit.teacher || '');
                    setLocation(eventToEdit.location || '');
                } else {
                    setTitle('');
                    setType('regular');
                    setDate(initialDate || new Date().toISOString().split('T')[0]);
                    setStartTime(initialTime || '08:00');
                    setDuration(45);
                    setCustomColor('');
                    setNotes('');
                    setDakaMode('all');
                    setDakaSubitems([]);
                    setTeacher('');
                    setLocation('');
                }
            }, [eventToEdit, isOpen, initialDate, initialTime]);

            const handleTypeChange = (newType) => {
                setType(newType);
                if (newType === 'daka' && dakaSubitems.length === 0) {
                    setDakaSubitems([
                        { id: 'sb-1', name: '大声背唐诗一首 📖', completed: false },
                        { id: 'sb-2', name: '背5个新英语单词 🔠', completed: false },
                        { id: 'sb-3', name: '整理好自己的一格书包桌 🎒', completed: false },
                    ]);
                }
            };

            const handleAddSub = () => {
                if (!newSub.trim()) return;
                setDakaSubitems([...dakaSubitems, { id: Math.random().toString(36).substring(2,7), name: newSub.trim(), completed: false }]);
                setNewSub('');
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!title.trim()) return;
                onSave({
                    id: eventToEdit?.id,
                    title: title.trim(),
                    type,
                    date,
                    startTime,
                    estimatedDuration: Number(duration),
                    textColor: customColor,
                    notes: notes.trim(),
                    ...(type === 'daka' ? { dakaSubitems, dakaMode } : {}),
                    ...(type === 'curriculum' ? { teacher, location } : {}),
                    completed: eventToEdit?.completed ?? false
                });
            };

            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm">
                    <div className="w-full max-w-lg bg-[#fffdf5] rounded-3xl border-4 border-pink-300 p-6 shadow-[8px_8px_0px_0px_#db2777] overflow-hidden flex flex-col max-h-[90vh]">
                        <div className="flex items-center justify-between pb-3 border-b-2 border-pink-100 shrink-0">
                            <h4 className="text-lg font-bold font-serif text-pink-700 flex items-center gap-1">✨ {eventToEdit ? '修订皇室计划' : '添加新的小梦想'}</h4>
                            <button onClick={onClose} className="p-1 rounded-full border border-pink-200 hover:bg-rose-50 cursor-pointer"><Icon name="X" className="w-5 h-5 text-pink-700" /></button>
                        </div>

                        <form onSubmit={handleSubmit} className="flex-1 overflow-y-auto py-4 space-y-4 pr-1 scrollbar-thin text-xs font-bold text-slate-700 text-left">
                            {/* Type chooser */}
                            <div>
                                <label className="block text-pink-700 mb-1.5">🎁 选择卡片事项魔法类型：</label>
                                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                                    {Object.keys(EVENT_COLORS).map(key => {
                                        const spec = EVENT_COLORS[key];
                                        return (
                                            <button key={key} type="button" onClick={() => handleTypeChange(key)} className={`p-2 rounded-xl border-2 flex flex-col items-center justify-center transition cursor-pointer ${type === key ? 'bg-pink-100 border-pink-400 text-pink-900 shadow-md' : 'bg-white border-pink-100 text-slate-500'}`}>
                                                <span className="text-2xl mb-1">{spec.emoji}</span>
                                                <span className="text-[10px]">{spec.label}</span>
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>

                            {/* Title */}
                            <div>
                                <label className="block mb-1 text-slate-600">🎈 魔法事件名称：</label>
                                <input type="text" value={title} onChange={e => setTitle(e.target.value)} placeholder="如：练钢琴、拼积木、上英语课" className="w-full px-3 py-2 rounded-xl border border-pink-300" required />
                            </div>

                            {/* Date time */}
                            <div className="grid grid-cols-2 gap-3 animate-fade-in">
                                <div>
                                    <label className="block mb-1 text-slate-600">📅 上课日期：</label>
                                    <input type="date" value={date} onChange={e => setDate(e.target.value)} className="w-full px-3 py-1.5 rounded-xl border border-pink-200" required />
                                </div>
                                <div>
                                    <label className="block mb-1 text-slate-600">⏰ 起始时间：</label>
                                    <input type="time" value={startTime} onChange={e => setStartTime(e.target.value)} className="w-full px-3 py-1.5 rounded-xl border border-pink-200" required />
                                </div>
                            </div>

                            {/* Duration slider */}
                            <div>
                                <label className="block mb-1 text-slate-600">⏱️ 这件事大概需要： <span className="text-pink-600 font-extrabold">{duration}</span> 分钟</label>
                                <input type="range" min="5" max="180" step="5" value={duration} onChange={e => setDuration(Number(e.target.value))} className="w-full accent-pink-500 cursor-pointer" />
                                <div className="flex gap-1.5 mt-1 overflow-x-auto py-1.5 scrollbar-none">
                                    {[15, 30, 45, 60, 90, 120].map(dr => (
                                        <button key={dr} type="button" onClick={() => setDuration(dr)} className={`text-[9px] px-2.5 py-0.5 rounded-full border shrink-0 ${duration === dr ? 'bg-pink-100 border-pink-400 text-pink-800' : 'bg-white'}`}>{dr}分钟</button>
                                    ))}
                                </div>
                            </div>

                            {/* Sub items */}
                            {type === 'daka' && (
                                <div className="bg-purple-50/50 p-3 rounded-2xl border border-purple-200 space-y-2">
                                    <div className="flex items-center justify-between">
                                        <span className="text-purple-900 font-bold flex items-center gap-1"><Icon name="CheckSquare" /> 打卡子任务：</span>
                                        <div className="flex bg-white rounded-lg p-0.5 border border-purple-200">
                                            <button type="button" onClick={() => setDakaMode('all')} className={`text-[9px] px-2 py-0.5 rounded ${dakaMode === 'all' ? 'bg-purple-600 text-white' : 'text-slate-500'}`}>全部完成</button>
                                            <button type="button" onClick={() => setDakaMode('any')} className={`text-[9px] px-2 py-0.5 rounded ${dakaMode === 'any' ? 'bg-purple-600 text-white' : 'text-slate-500'}`}>完成任意</button>
                                        </div>
                                    </div>
                                    <div className="space-y-1">
                                        {dakaSubitems.map(s => (
                                            <div key={s.id} className="flex items-center justify-between p-1.5 bg-white rounded-lg border border-purple-100">
                                                <span className="text-[10px]">{s.name}</span>
                                                <button type="button" onClick={() => setDakaSubitems(dakaSubitems.filter(it=>it.id!==s.id))} className="text-purple-400 hover:text-red-500"><Icon name="Trash2" className="w-3.5 h-3.5" /></button>
                                            </div>
                                        ))}
                                    </div>
                                    <div className="flex gap-1">
                                        <input type="text" value={newSub} onChange={e => setNewSub(e.target.value)} placeholder="如：自己搬椅子归位 🧸" className="flex-grow px-2 py-1 text-[10.5px] rounded border" />
                                        <button type="button" onClick={handleAddSub} className="bg-purple-100 px-3 py-1 text-purple-800 border rounded font-bold text-[10px]">加</button>
                                    </div>
                                </div>
                            )}

                            {/* Extra Course elements */}
                            {type === 'curriculum' && (
                                <div className="bg-emerald-50/50 p-3 border border-emerald-250 rounded-2xl grid grid-cols-2 gap-2">
                                    <div>
                                        <label className="text-[10px] text-emerald-800">👤 授课老师 / 魔法大咖：</label>
                                        <input type="text" value={teacher} onChange={e => setTeacher(e.target.value)} className="w-full px-2 py-1 bg-white border border-emerald-200 rounded text-[10.5px]" placeholder="辛德瑞拉老师" />
                                    </div>
                                    <div>
                                        <label className="text-[10px] text-emerald-800">📍 专属上课地点：</label>
                                        <input type="text" value={location} onChange={e => setLocation(e.target.value)} className="w-full px-2 py-1 bg-white border border-emerald-200 rounded text-[10.5px]" placeholder="梦幻舞池/操场" />
                                    </div>
                                </div>
                            )}

                            {/* Color picker */}
                            <div>
                                <label className="block mb-1 text-slate-600">🎨 小卡片字样预设颜色：</label>
                                <div className="flex flex-wrap gap-1.5 items-center">
                                    {[
                                        { val: '', label: '预置颜色', style: 'bg-slate-200' },
                                        { val: '#ef4444', label: '苹果红', style: 'bg-red-500' },
                                        { val: '#f97316', label: '阳光橙', style: 'bg-orange-500' },
                                        { val: '#10b981', label: '森林绿', style: 'bg-emerald-500' },
                                        { val: '#3b82f6', label: '天空蓝', style: 'bg-blue-500' },
                                        { val: '#8b5cf6', label: '葡萄紫', style: 'bg-purple-500' },
                                        { val: '#ec4899', label: '玫瑰粉', style: 'bg-pink-500' }
                                    ].map(color => (
                                        <button key={color.val} type="button" onClick={() => setCustomColor(color.val)} className={`w-6 h-6 rounded-full ${color.style} ${customColor === color.val ? 'ring-2 ring-slate-800 border' : ''}`} title={color.label} />
                                    ))}
                                    <span className="text-[10px] border border-pink-200 p-1.5 rounded bg-white shrink-0 ml-2 animate-pulse" style={{ color: customColor || EVENT_COLORS[type].fillColor }}>字样效果展示</span>
                                </div>
                            </div>

                            {/* Notes */}
                            <div>
                                <label className="block mb-1 text-slate-600">📝 贴心小笔记 (贴心小纸条)：</label>
                                <textarea value={notes} onChange={e => setNotes(e.target.value)} rows="2" placeholder="记得要准备什么呢？带好皇家图书和练习本哦！" className="w-full px-3 py-1.5 rounded-xl border border-pink-300" />
                            </div>
                        </form>

                        <div className="pt-3 border-t flex justify-between shrink-0">
                            {eventToEdit ? (
                                <button type="button" onClick={() => onDelete(eventToEdit.id)} className="px-4 py-2 bg-rose-100 hover:bg-rose-200 text-rose-700 rounded-xl border font-bold flex items-center gap-1">
                                    <Icon name="Trash2" /> 扔掉
                                </button>
                            ) : <div />}
                            <div className="flex gap-2">
                                <button type="button" onClick={onClose} className="px-4 py-2 hover:bg-slate-50 border rounded-xl font-bold">拒绝</button>
                                <button type="button" onClick={handleSubmit} className="px-5 py-2 bg-yellow-300 hover:bg-yellow-400 text-pink-900 font-bold border-2 border-pink-300 rounded-xl shadow">🎉 施法准备完毕！</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // MAIN ROOT COMPONENT: App
        function App() {
            const [events, setEvents] = useState([]);
            const [currentDate, setCurrentDate] = useState(new Date());
            const [viewMode, setViewMode] = useState('month');
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [eventToEdit, setEventToEdit] = useState(null);
            const [draggedItem, setDraggedItem] = useState(null);

            useEffect(() => {
                const saved = localStorage.getItem('kid_calendar_events');
                if (saved) {
                    try {
                        setEvents(JSON.parse(saved));
                        return;
                    } catch(e) {
                        console.error("Database parsing failed, resetting...");
                    }
                }

                // Initial Seed events relative to today
                const todayStr = formatDate(new Date());
                const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1);
                const tomorrowStr = formatDate(tomorrow);

                const defaults = [
                    { id: 'init-1', title: '皇家文学 📖 辛弃疾词解说', type: 'curriculum', date: todayStr, startTime: '08:30', estimatedDuration: 45, completed: true, teacher: '明月先生', location: '朝露殿' },
                    { id: 'init-2', title: '优雅礼仪 👑 皇家行礼初通关', type: 'curriculum', date: todayStr, startTime: '09:00', estimatedDuration: 45, completed: false, teacher: '贝拉仙女', location: '水晶舞池', notes: '此课程与文学时间稍微重叠啦！试试用鼠标拖动我来避开冲突吧！冲突解决后红色高亮就会消失哦。' },
                    { id: 'init-3', title: '练钢琴 🎹 贝多芬《欢乐颂》', type: 'regular', date: todayStr, startTime: '16:00', estimatedDuration: 40, completed: false, notes: '老师说要慢弹！' },
                    { id: 'init-4', title: '整理画笔 🌌 收拾书包明日画画', type: 'reminder', date: todayStr, startTime: '21:00', estimatedDuration: 15, completed: false },
                    { id: 'init-5', title: '早晨智慧小习惯打卡 ⭐', type: 'daka', date: todayStr, startTime: '07:30', estimatedDuration: 30, completed: false, dakaMode: 'all', dakaSubitems: [
                        { id: 'sb-1', name: '大声背唐诗一首 📖', completed: true },
                        { id: 'sb-2', name: '大声背英语单词五个 🎧', completed: false },
                        { id: 'sb-3', name: '口算挑战一页 💯', completed: false }
                    ]}
                ];
                setEvents(defaults);
                localStorage.setItem('kid_calendar_events', JSON.stringify(defaults));
            }, []);

            const saveEventsState = (newEvs) => {
                setEvents(newEvs);
                localStorage.setItem('kid_calendar_events', JSON.stringify(newEvs));
            };

            const handleSaveEvent = (data) => {
                if (data.id) {
                    const u = events.map(e => e.id === data.id ? { ...e, ...data } : e);
                    saveEventsState(u);
                } else {
                    const fresh = { ...data, id: Math.random().toString(36).substring(2, 9) };
                    saveEventsState([...events, fresh]);
                }
                setIsModalOpen(false);
                setEventToEdit(null);
            };

            const handleDeleteEvent = (id) => {
                const u = events.filter(e => e.id !== id);
                saveEventsState(u);
                setIsModalOpen(false);
                setEventToEdit(null);
            };

            const handleUpdateEventDirect = (updated) => {
                const u = events.map(e => e.id === updated.id ? updated : e);
                saveEventsState(u);
            };

            const handleEventMove = (eventId, newDate, newTime) => {
                const u = events.map(e => e.id === eventId ? { ...e, date: newDate, ...(newTime ? { startTime: newTime } : {}) } : e);
                saveEventsState(u);
            };

            const handleOpenAddDaka = (dateStr) => {
                setEventToEdit({
                    id: '', title: '新好习惯打卡 ⭐', type: 'daka', date: dateStr || formatDate(currentDate), startTime: '08:00', estimatedDuration: 30, completed: false, dakaMode: 'all', dakaSubitems: [
                        { id: '1', name: '大声朗读英语单词 🔠', completed: false },
                        { id: '2', name: '多喝一杯温暖牛奶 🥛', completed: false },
                        { id: '3', name: '自主静心课外阅读 📖', completed: false },
                    ]
                });
                setIsModalOpen(true);
            };

            return (
                <div className="p-3 sm:p-6 pb-12 max-w-7xl mx-auto space-y-6">
                    {/* Header */}
                    <CalendarHeader
                        viewMode={viewMode}
                        setViewMode={setViewMode}
                        currentDate={currentDate}
                        setCurrentDate={setCurrentDate}
                        onAddEventClick={() => { setEventToEdit(null); setIsModalOpen(true); }}
                        events={events}
                    />

                    {/* Routing Renders */}
                    <div className="relative">
                        {viewMode === 'month' && (
                            <MonthView
                                currentDate={currentDate}
                                events={events}
                                onEventClick={event => { setEventToEdit(event); setIsModalOpen(true); }}
                                onAddEventClick={date => { setEventToEdit(null); setIsModalOpen(true); }}
                                onEventMove={handleEventMove}
                                setDraggedItem={setDraggedItem}
                                draggedItem={draggedItem}
                                onDayClick={day => { setCurrentDate(day); setViewMode('day'); }}
                            />
                        )}

                        {viewMode === 'week' && (
                            <WeekView
                                currentDate={currentDate}
                                events={events}
                                onEventClick={event => { setEventToEdit(event); setIsModalOpen(true); }}
                                onAddEventClick={(date, time) => { setEventToEdit(null); setIsModalOpen(true); }}
                                onEventMove={handleEventMove}
                                setDraggedItem={setDraggedItem}
                                draggedItem={draggedItem}
                                onDayClick={day => { setCurrentDate(day); setViewMode('day'); }}
                            />
                        )}

                        {viewMode === 'day' && (
                            <DayView
                                currentDate={currentDate}
                                events={events}
                                onEventClick={event => { setEventToEdit(event); setIsModalOpen(true); }}
                                onAddEventClick={(date, time) => { setEventToEdit(null); setIsModalOpen(true); }}
                                onEventMove={handleEventMove}
                                onUpdateEvent={handleUpdateEventDirect}
                                setDraggedItem={setDraggedItem}
                                draggedItem={draggedItem}
                            />
                        )}

                        {viewMode === 'dakaPanel' && (
                            <DakaPanel
                                events={events}
                                onUpdateEvent={handleUpdateEventDirect}
                                onAddDakaClick={handleOpenAddDaka}
                                onEventClick={event => { setEventToEdit(event); setIsModalOpen(true); }}
                            />
                        )}

                        {viewMode === 'curriculumView' && (
                            <CurriculumView
                                currentDate={currentDate}
                                events={events}
                                onSaveEvent={handleSaveEvent}
                                onDeleteEvent={handleDeleteEvent}
                                onUpdateEvent={handleUpdateEventDirect}
                            />
                        )}
                    </div>

                    {/* Rewards badges */}
                    <RewardSection events={events} />

                    {/* Footer instructions */}
                    <div className="bg-[#fffdf8] border-4 border-pink-300 rounded-3xl p-6 shadow-[5px_5px_0px_0px_#db2777] text-left">
                        <h4 className="text-sm font-bold font-serif text-pink-700 flex items-center gap-1.5 border-b-2 border-pink-100 pb-2 mb-4">
                            👸 皇家公主时间魔法宝典使用指南：
                        </h4>
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            {USER_GUIDE.map((guide, idx) => (
                                <div key={idx} className="flex items-start gap-2.5 p-3 rounded-2xl border bg-white hover:border-pink-300 transition shadow-sm">
                                    <span className="text-2xl select-none shrink-0">{guide.emoji}</span>
                                    <p className="text-[11px] font-bold text-pink-900 leading-relaxed">{guide.text}</p>
                                </div>
                            ))}
                        </div>
                        <div className="mt-5 border-t border-dashed border-pink-100 pt-3 flex flex-wrap justify-between text-[11px] font-extrabold text-pink-400">
                            <span>✨ 用心打造的专属儿童自律时间魔法盒</span>
                            <span>Created with Google AI Studio & Babel Standalone</span>
                        </div>
                    </div>

                    {/* Popups Event creator */}
                    <EventModal
                        isOpen={isModalOpen}
                        onClose={() => { setIsModalOpen(false); setEventToEdit(null); }}
                        onSave={handleSaveEvent}
                        onDelete={handleDeleteEvent}
                        eventToEdit={eventToEdit}
                        initialDate={formatDate(currentDate)}
                    />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
